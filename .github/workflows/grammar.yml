name: Grammaire (phrases Tatoeba)

# Compte, pour chaque point de grammaire anglaise, les phrases Tatoeba candidates (avec traduction française)
# et la banque d'exercices de chaque leçon (public/grammar/en/exercises), puis les enregistre dans la branche.
# Alerte si un point en a moins de 30. Écarte les phrases signalées par les utilisateurs (lues dans Supabase) :
# relancer ce workflow à la main (Actions → Run workflow) pour les retirer sans attendre une modification du code.

on:
  workflow_dispatch:
  push:
    paths:
      ['scripts/grammar-tatoeba.ts', 'scripts/grammar-blocklist.txt', 'src/core/learn/patterns.ts', 'src/core/learn/exercises.ts', 'src/core/learn/placementBank.ts', 'src/core/learn/placementBuilders.ts', 'src/core/learn/lessonBuilders.ts', 'scripts/placement-bank.ts', 'public/grammar/en/placement-written.json', 'public/grammar/en/placement-excluded.json', 'public/grammar/en/points.json', 'public/grammar/en/lessons.json', '.github/workflows/grammar.yml']

permissions:
  contents: write

concurrency:
  group: grammar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  count:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Exports Tatoeba
        run: |
          mkdir -p tatoeba && cd tatoeba
          base=https://downloads.tatoeba.org/exports/per_language
          curl -fsSL "$base/eng/eng_sentences.tsv.bz2" | bunzip2 > eng_sentences.tsv
          curl -fsSL "$base/fra/fra_sentences.tsv.bz2" | bunzip2 > fra_sentences.tsv
          # Liens anglais → français : export par paire, sinon l'export complet des liens filtré sur le français.
          if curl -fsSL "$base/eng/eng-fra_links.tsv.bz2" | bunzip2 > eng-fra_links.tsv; then
            echo "liens eng-fra : $(wc -l < eng-fra_links.tsv)"
          else
            cut -f1 fra_sentences.tsv > fra_ids.txt
            curl -fsSL https://downloads.tatoeba.org/exports/links.tar.bz2 | tar -xjO > links.csv
            awk 'NR==FNR { fra[$1]; next } ($2 in fra) { print $1 "\t" $2 }' fra_ids.txt links.csv > eng-fra_links.tsv
            echo "liens filtrés : $(wc -l < eng-fra_links.tsv)"
          fi
          wc -l eng_sentences.tsv
      - name: Phrases signalées par les utilisateurs
        # Comptes anonymes renvoyés par la fonction grammar_reported_items (supabase/schema.sql), avec la clé publique.
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_KEY" ]; then echo "::warning::Pas d'accès Supabase : signalements non lus."; exit 0; fi
          if curl -fsS -X POST "$SUPABASE_URL/rest/v1/rpc/grammar_reported_items" \
              -H "apikey: $SUPABASE_KEY" -H "Authorization: Bearer $SUPABASE_KEY" -H "Content-Type: application/json" -d '{}' \
              -o tatoeba/reported.json; then
            echo "signalements : $(node -e 'console.log(JSON.parse(require("fs").readFileSync("tatoeba/reported.json","utf8")).length)')"
          else
            rm -f tatoeba/reported.json
            echo "::warning::Fonction grammar_reported_items absente ou inaccessible : relancer supabase/schema.sql."
          fi
      - run: npx vite-node scripts/grammar-tatoeba.ts tatoeba
      - name: Banque du placement (tirée des banques des leçons)
        run: npx vite-node scripts/placement-bank.ts
      - name: Enregistrer les comptes
        run: |
          git add public/grammar/en/tatoeba-counts.json public/grammar/en/exercises public/grammar/en/placement public/grammar/en/placement.json
          if git diff --cached --quiet; then echo "Comptes inchangés."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Grammaire : phrases Tatoeba candidates ($(date -u +%Y-%m-%d))"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
