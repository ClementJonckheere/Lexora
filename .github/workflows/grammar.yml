name: Grammaire (phrases Tatoeba)

# Compte, pour chaque point de grammaire anglaise, les phrases Tatoeba candidates (avec traduction française)
# et enregistre public/grammar/en/tatoeba-counts.json dans la branche. Alerte si un point en a moins de 30.

on:
  workflow_dispatch:
  push:
    paths: ['scripts/grammar-tatoeba.ts', 'src/core/learn/patterns.ts', 'public/grammar/en/points.json', '.github/workflows/grammar.yml']

permissions:
  contents: write

concurrency:
  group: grammar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  count:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Exports Tatoeba
        run: |
          mkdir -p tatoeba && cd tatoeba
          base=https://downloads.tatoeba.org/exports/per_language
          curl -fsSL "$base/eng/eng_sentences.tsv.bz2" | bunzip2 > eng_sentences.tsv
          # Liens anglais → français : export par paire, sinon l'export complet des liens filtré sur le français.
          if curl -fsSL "$base/eng/eng-fra_links.tsv.bz2" | bunzip2 > eng-fra_links.tsv; then
            echo "liens eng-fra : $(wc -l < eng-fra_links.tsv)"
          else
            curl -fsSL "$base/fra/fra_sentences.tsv.bz2" | bunzip2 | cut -f1 > fra_ids.txt
            curl -fsSL https://downloads.tatoeba.org/exports/links.tar.bz2 | tar -xjO > links.csv
            awk 'NR==FNR { fra[$1]; next } ($2 in fra) { print $1 "\t" $2 }' fra_ids.txt links.csv > eng-fra_links.tsv
            echo "liens filtrés : $(wc -l < eng-fra_links.tsv)"
          fi
          wc -l eng_sentences.tsv
      - run: npx vite-node scripts/grammar-tatoeba.ts tatoeba
      - name: Enregistrer les comptes
        run: |
          git add public/grammar/en/tatoeba-counts.json
          if git diff --cached --quiet; then echo "Comptes inchangés."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Grammaire : phrases Tatoeba candidates ($(date -u +%Y-%m-%d))"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
